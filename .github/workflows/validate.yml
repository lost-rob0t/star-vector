name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@v31
      - name: Check locked package and installed CLI, C ABI and Lisp clients
        run: nix flake check --no-update-lock-file -L
      - name: Export synthetic scale measurements
        run: |
          out=$(nix build --no-update-lock-file --no-link --print-out-paths)
          cp "$out/share/star-vector/storage-benchmark.json" storage-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: storage-benchmark-${{ matrix.runner }}
          path: storage-benchmark.json
      - name: Build and run app outside the checkout
        run: bash tests/flake-app.sh
  rage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Synchronize structure
        run: python3 scripts/sync.py
      - name: Check synchronization
        run: python3 scripts/sync.py --check
      - name: Validate research control plane
        run: python3 scripts/validate-docs.py
