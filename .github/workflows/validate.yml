name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@v31
      - name: Check locked package and installed CLI, C ABI and Lisp clients
        run: |
          set +e
          nix flake check --no-update-lock-file -L > nix-flake-check.log 2>&1
          check_status=$?
          set -e
          tail -n 250 nix-flake-check.log
          exit "$check_status"
      - name: Retain complete package check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-flake-check-${{ matrix.runner }}
          path: nix-flake-check.log
          if-no-files-found: error
      - name: Export synthetic scale measurements
        run: |
          out=$(nix build --no-update-lock-file --no-link --print-out-paths)
          cp "$out/share/star-vector/storage-benchmark.json" storage-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: storage-benchmark-${{ matrix.runner }}
          path: storage-benchmark.json
      - name: Export matched memory profiles
        run: |
          out=$(nix build .#memory-profile --no-update-lock-file --no-link --print-out-paths)
          cp "$out/memory-profile.json" memory-profile.json
      - uses: actions/upload-artifact@v4
        with:
          name: memory-profile-${{ matrix.runner }}
          path: memory-profile.json
      - name: Build and run app outside the checkout
        run: bash tests/flake-app.sh
      - name: Export real-model client proof
        run: |
          out=$(nix build .#text-check --no-update-lock-file --no-link --print-out-paths)
          cp "$out/evidence.json" text-client-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: text-client-proof-${{ matrix.runner }}
          path: text-client-proof.json
  rage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Synchronize structure
        run: python3 scripts/sync.py
      - name: Check synchronization
        run: python3 scripts/sync.py --check
      - name: Validate research control plane
        run: python3 scripts/validate-docs.py
